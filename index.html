<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syde Kasir - Coffee Shop POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#09090b',
                            800: '#18181b',
                            700: '#27272a',
                            600: '#3f3f46',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-zinc-800 selection:text-white">

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="h-full flex flex-col overflow-hidden">
        <!-- TOP NAVIGATION BAR -->
        <header class="bg-zinc-900 border-b border-zinc-800 flex flex-col md:flex-row items-center justify-between px-4 sm:px-6 py-3 md:py-0 md:h-16 shrink-0 z-20 gap-3 md:gap-0">
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 sm:w-9 sm:h-9 bg-white text-black rounded-lg flex items-center justify-center font-bold">
                        <i class="fa-solid fa-mug-hot text-sm sm:text-base"></i>
                    </div>
                    <span class="font-bold text-base sm:text-lg tracking-wider">SYDE KASIR</span>
                </div>
                <!-- User Profile badge on Mobile -->
                <div class="flex md:hidden items-center space-x-2">
                    <div class="w-8 h-8 bg-zinc-800 rounded-full flex items-center justify-center text-xs font-bold border border-zinc-700" id="user-avatar-mobile">A</div>
                </div>
            </div>

            <!-- Tab Navigation - Horizontally Scrollable on Mobile -->
            <nav id="nav-tabs" class="flex w-full md:w-auto overflow-x-auto no-scrollbar space-x-1.5 pb-1 md:pb-0">
                <button onclick="switchTab('pos')" class="nav-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors bg-white text-black whitespace-nowrap shrink-0" data-tab="pos">
                    <i class="fa-solid fa-cash-register mr-1.5"></i>Kasir (POS)
                </button>
                <button onclick="switchTab('history')" class="nav-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap shrink-0" data-tab="history">
                    <i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Riwayat
                </button>
                <button onclick="switchTab('products')" class="admin-only nav-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap shrink-0" data-tab="products">
                    <i class="fa-solid fa-boxes-stacked mr-1.5"></i>Produk
                </button>
                <button onclick="switchTab('categories')" class="admin-only nav-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap shrink-0" data-tab="categories">
                    <i class="fa-solid fa-tags mr-1.5"></i>Kategori
                </button>
                <button onclick="switchTab('analytics')" class="admin-only nav-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors text-zinc-400 hover:text-white hover:bg-zinc-800 whitespace-nowrap shrink-0" data-tab="analytics">
                    <i class="fa-solid fa-chart-line mr-1.5"></i>Laporan
                </button>
            </nav>

            <!-- User Profile badge on Desktop -->
            <div class="hidden md:flex items-center space-x-4">
                <div class="flex items-center space-x-3 bg-zinc-800 px-3 py-1.5 rounded-full border border-zinc-700">
                    <div class="w-7 h-7 bg-zinc-700 rounded-full flex items-center justify-center text-xs font-bold" id="user-avatar-initial">A</div>
                    <div class="text-xs">
                        <div class="font-semibold" id="user-display-name">Syde Coffee</div>
                        <div class="text-zinc-400 capitalize" id="user-display-role">Syde Coffee</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="flex-1 overflow-hidden relative">
            
            <!-- TAB 1: POS (KASIR) -->
            <div id="tab-pos" class="tab-content h-full flex flex-col md:flex-row relative">
                <!-- Left: Product Catalog -->
                <div class="flex-1 flex flex-col h-full bg-zinc-950 p-4 sm:p-6 overflow-hidden">
                    <!-- Search & Filter Category -->
                    <div class="flex flex-col sm:flex-row gap-3 mb-4 sm:mb-6 shrink-0">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
                            <input type="text" id="pos-search" oninput="filterPOSProducts()" placeholder="Cari menu kopi atau makanan..." 
                                class="w-full pl-10 pr-4 py-2.5 sm:py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white text-sm placeholder-zinc-500 focus:outline-none focus:border-white transition-colors">
                        </div>
                        <div id="pos-category-filters" class="flex gap-2 overflow-x-auto pb-1 sm:pb-0 no-scrollbar">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Products Grid -->
                    <div class="flex-1 overflow-y-auto pr-1 pb-16 md:pb-0">
                        <div id="pos-products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
